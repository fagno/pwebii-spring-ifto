<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" xml:space="preserve" role="img" aria-labelledby="title desc">
<title id="title">Tabela de associação • pessoas_enderecos</title><desc id="desc">Pessoa 1 Ana possui endereços 10 e 20. Pessoa 2 Bruno possui endereço 10. A tabela associativa possui pares 1/10, 1/20 e 2/10, sem duplicatas.</desc>
<metadata>Elaboração própria para pwebii-spring-ifto. Licença MIT do repositório. Referências conceituais: https://jakarta.ee/specifications/persistence/3.2/ e https://docs.hibernate.org/orm/7.2/userguide/html_single/ . Nenhuma figura externa reproduzida.</metadata>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="0" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#475569}.section{font-size:14px;font-weight:700;letter-spacing:1px;fill:#475569}.body{font-size:18px}.small{font-size:16px;fill:#475569}.cardtitle{font-size:20px;font-weight:700;fill:white}.label{font-size:16px;font-weight:700;fill:#334155}.note{font-size:17px;fill:#334155}</style>
<rect width="1000" height="640" rx="14" fill="#f8fafc"/><text x="32" y="43" class="title" text-anchor="start">Tabela de associação • pessoas_enderecos</text><text x="32" y="74" class="sub" text-anchor="start">As entidades continuam independentes; a tabela intermediária registra os vínculos.</text><text x="32" y="115" class="section" text-anchor="start">EXEMPLO DE REGISTROS</text><rect x="32" y="139" width="260" height="147" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="32" y="139" width="260" height="43" rx="10" fill="#1d4ed8"/><rect x="32" y="165" width="260" height="17" fill="#1d4ed8"/><text x="48" y="167" class="cardtitle" text-anchor="start">tb_pessoa</text><text x="48" y="209" class="body" text-anchor="start">id [PK]     nome</text><text x="48" y="238" class="body" text-anchor="start">1              Ana</text><text x="48" y="267" class="body" text-anchor="start">2              Bruno</text><rect x="350" y="139" width="300" height="176" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="350" y="139" width="300" height="43" rx="10" fill="#854d0e"/><rect x="350" y="165" width="300" height="17" fill="#854d0e"/><text x="366" y="167" class="cardtitle" text-anchor="start">pessoas_enderecos</text><text x="366" y="209" class="small" text-anchor="start">id_pessoa [FK]  id_endereco [FK]</text><text x="366" y="238" class="body" text-anchor="start">1                       10</text><text x="366" y="267" class="body" text-anchor="start">1                       20</text><text x="366" y="296" class="body" text-anchor="start">2                       10</text><rect x="708" y="139" width="260" height="147" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="708" y="139" width="260" height="43" rx="10" fill="#0f766e"/><rect x="708" y="165" width="260" height="17" fill="#0f766e"/><text x="724" y="167" class="cardtitle" text-anchor="start">tb_endereco</text><text x="724" y="209" class="body" text-anchor="start">id [PK]     logradouro</text><text x="724" y="238" class="body" text-anchor="start">10            Rua A</text><text x="724" y="267" class="body" text-anchor="start">20            Rua B</text><line x1="350" y1="228" x2="292" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="650" y1="228" x2="708" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="395" class="section" text-anchor="start">COMO LER</text><text x="32" y="432" class="note" text-anchor="start">Ana está associada aos endereços 10 e 20.</text><text x="32" y="469" class="note" text-anchor="start">Bruno compartilha o endereço 10 com Ana.</text><text x="32" y="506" class="note" text-anchor="start">Cada linha representa um vínculo; o par (id_pessoa, id_endereco) é único.</text><text x="32" y="550" class="small" text-anchor="start">PK = chave primária     FK = chave estrangeira     UNIQUE = restrição de unicidade</text><line x1="32" y1="590" x2="968" y2="590" stroke="#cbd5e1" stroke-width="2"/><text x="32" y="617" class="small" text-anchor="start">Elaboração própria • JPA 3.2 / Hibernate ORM • Referências e licença em images/jpa/README.adoc</text>
</svg>
