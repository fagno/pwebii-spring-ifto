<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" xml:space="preserve" role="img" aria-labelledby="title desc">
<title id="title">Herança • três formas de organizar as tabelas</title><desc id="desc">SINGLE_TABLE contém id nome tipo cpf cnpj. JOINED tem uma raiz com id nome e subclasses com PK/FK e campo específico. TABLE_PER_CLASS repete id nome e o campo específico em cada tabela concreta.</desc>
<metadata>Elaboração própria para pwebii-spring-ifto. Licença MIT do repositório. Referências conceituais: https://jakarta.ee/specifications/persistence/3.2/ e https://docs.hibernate.org/orm/7.2/userguide/html_single/ . Nenhuma figura externa reproduzida.</metadata>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="arrowStart" markerWidth="9" markerHeight="9" refX="0" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#475569}.section{font-size:14px;font-weight:700;letter-spacing:1px;fill:#475569}.body{font-size:18px}.small{font-size:16px;fill:#475569}.cardtitle{font-size:20px;font-weight:700;fill:white}.label{font-size:16px;font-weight:700;fill:#334155}.note{font-size:17px;fill:#334155}</style>
<rect width="1000" height="750" rx="14" fill="#f8fafc"/><text x="32" y="43" class="title" text-anchor="start">Herança • três formas de organizar as tabelas</text><text x="32" y="74" class="sub" text-anchor="start">Mesma hierarquia: Pessoa (abstrata), PessoaFisica e PessoaJuridica.</text><text x="32" y="118" class="section" text-anchor="start">SINGLE_TABLE</text><text x="360" y="118" class="section" text-anchor="start">JOINED</text><text x="688" y="118" class="section" text-anchor="start">TABLE_PER_CLASS</text><rect x="32" y="142" width="280" height="205" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="32" y="142" width="280" height="43" rx="10" fill="#1d4ed8"/><rect x="32" y="168" width="280" height="17" fill="#1d4ed8"/><text x="48" y="170" class="cardtitle" text-anchor="start">tb_pessoa</text><text x="48" y="212" class="body" text-anchor="start">id [PK]</text><text x="48" y="241" class="body" text-anchor="start">nome</text><text x="48" y="270" class="body" text-anchor="start">tipo: F ou J</text><text x="48" y="299" class="body" text-anchor="start">cpf (apenas F)</text><text x="48" y="328" class="body" text-anchor="start">cnpj (apenas J)</text><rect x="360" y="142" width="280" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="360" y="142" width="280" height="43" rx="10" fill="#1d4ed8"/><rect x="360" y="168" width="280" height="17" fill="#1d4ed8"/><text x="376" y="170" class="cardtitle" text-anchor="start">tb_pessoa</text><text x="376" y="212" class="body" text-anchor="start">id [PK]</text><text x="376" y="241" class="body" text-anchor="start">nome</text><rect x="360" y="318" width="280" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="360" y="318" width="280" height="43" rx="10" fill="#0f766e"/><rect x="360" y="344" width="280" height="17" fill="#0f766e"/><text x="376" y="346" class="cardtitle" text-anchor="start">tb_pessoafisica</text><text x="376" y="388" class="body" text-anchor="start">id_pessoa [PK, FK]</text><text x="376" y="417" class="body" text-anchor="start">cpf</text><rect x="360" y="499" width="280" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="360" y="499" width="280" height="43" rx="10" fill="#0f766e"/><rect x="360" y="525" width="280" height="17" fill="#0f766e"/><text x="376" y="527" class="cardtitle" text-anchor="start">tb_pessoajuridica</text><text x="376" y="569" class="body" text-anchor="start">id_pessoa [PK, FK]</text><text x="376" y="598" class="body" text-anchor="start">cnpj</text><line x1="640" y1="388" x2="666" y2="388" stroke="#64748b" stroke-width="2"/><line x1="666" y1="388" x2="666" y2="212" stroke="#64748b" stroke-width="2"/><line x1="666" y1="212" x2="640" y2="212" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="640" y1="569" x2="678" y2="569" stroke="#64748b" stroke-width="2"/><line x1="678" y1="569" x2="678" y2="222" stroke="#64748b" stroke-width="2"/><line x1="678" y1="222" x2="640" y2="222" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="688" y="142" width="280" height="147" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="688" y="142" width="280" height="43" rx="10" fill="#854d0e"/><rect x="688" y="168" width="280" height="17" fill="#854d0e"/><text x="704" y="170" class="cardtitle" text-anchor="start">tb_pessoafisica</text><text x="704" y="212" class="body" text-anchor="start">id [PK]</text><text x="704" y="241" class="body" text-anchor="start">nome</text><text x="704" y="270" class="body" text-anchor="start">cpf</text><rect x="688" y="347" width="280" height="147" rx="10" fill="#ffffff" stroke="#cbd5e1"/><rect x="688" y="347" width="280" height="43" rx="10" fill="#854d0e"/><rect x="688" y="373" width="280" height="17" fill="#854d0e"/><text x="704" y="375" class="cardtitle" text-anchor="start">tb_pessoajuridica</text><text x="704" y="417" class="body" text-anchor="start">id [PK]</text><text x="704" y="446" class="body" text-anchor="start">nome</text><text x="704" y="475" class="body" text-anchor="start">cnpj</text><text x="32" y="405" class="note" text-anchor="start">Uma linha por pessoa.</text><text x="32" y="434" class="small" text-anchor="start">tipo identifica a subclasse.</text><text x="32" y="463" class="small" text-anchor="start">Campos específicos não</text><text x="32" y="488" class="small" text-anchor="start">se aplicam a todas as linhas.</text><text x="688" y="554" class="small" text-anchor="start">Pessoa é abstrata: não há</text><text x="688" y="579" class="small" text-anchor="start">tabela raiz nesta alternativa.</text><text x="32" y="669" class="small" text-anchor="start">O diagrama omite a tabela auxiliar gerador_ids usada pelo gerador TABLE.</text><line x1="32" y1="700" x2="968" y2="700" stroke="#cbd5e1" stroke-width="2"/><text x="32" y="727" class="small" text-anchor="start">Elaboração própria • JPA 3.2 / Hibernate ORM • Referências e licença em images/jpa/README.adoc</text>
</svg>
