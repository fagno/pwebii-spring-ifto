<title id="title">Muitos-para-muitos • bidirecional</title><desc id="desc">Pessoa e Endereco têm coleções. Pessoa define pessoas_enderecos, que contém uma chave estrangeira para cada tabela e uma restrição de unicidade do par.</desc>
